<style>
:root {
  --bg: #fafaf5;

[data-theme="dark"] {

  --accent: #5588ff;

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', 'Source Serif 4', Georgia, serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
  transition: background 0.3s, color 0.3s;
}
.container { max-width: 800px; margin: 0 auto; padding: 40px 24px; }
.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;

}
.back-link {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  color: var(--muted);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.back-link:hover { color: var(--accent); }
.controls { display: flex; gap: 12px; align-items: center; }

}
h1 {
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 4px;
}
h1 .ko { color: var(--muted); font-weight: 400; font-size: 1.1rem; display: block; margin-top: 4px; }
.summary {
  font-size: 1.05rem;
  color: var(--muted);
  margin: 20px 0;
  padding: 20px 24px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);

}
.meta-grid {
  display: flex;

  margin: 20px 0;
}
.meta-item {
  padding: 12px 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.meta-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;

}
.tag-build { background: var(--tag-build); }
.tag-learn { background: var(--tag-learn); }
.tag-ref { background: var(--tag-ref); }
.lang-tag {

}
.github-link {
  display: inline-flex;
  align-items: center;

  border-radius: var(--radius);
}
.content-error { color: #cc4444; }

<body>
<div class="container">
  <div class="nav-bar">
    <a class="back-link" href="index.html" data-en="&#8592; Back to Curriculum" data-ko="&#8592; 커리큘럼으로 돌아가기">&#8592; Back to Curriculum</a>
    <div class="controls">
      <button class="btn lang-btn btn-active" data-lang="en" onclick="setLang('en')">EN</button>
      <button class="btn lang-btn" data-lang="ko" onclick="setLang('ko')">KO</button>
      <button class="btn theme-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme">&#9790;</button>
    </div>
  </div>

  <div id="content">
    <div class="not-found">
      <h2 data-en="Loading..." data-ko="로딩 중...">Loading...</h2>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
function getParams() {
  const params = new URLSearchParams(window.location.search);
  return { p: parseInt(params.get('p')), l: parseInt(params.get('l')) };
}

function findLesson() {
  const params = getParams();
  if (isNaN(params.p) || isNaN(params.l)) return null;
  const phase = PHASES.find(function(ph) { return ph.id === params.p; });
  if (!phase) return null;
  return { phase: phase, lesson: phase.lessons[params.l], lessonIndex: params.l, phaseIndex: params.p };
}

function toRawUrl(githubUrl) {
  return githubUrl
    .replace('https://github.com/', 'https://raw.githubusercontent.com/')
    .replace('/tree/main/', '/main/')
    + 'docs/en.md';
}

function toRawCodeUrl(githubUrl, lang) {
  var ext = 'py';
  if (lang === 'TypeScript') ext = 'ts';
  else if (lang === 'Rust') ext = 'rs';
  else if (lang === 'Julia') ext = 'jl';
  else if (lang === 'Docker') ext = 'Dockerfile';
  else if (lang === 'Shell') ext = 'sh';
  return githubUrl
    .replace('https://github.com/', 'https://raw.githubusercontent.com/')
    .replace('/tree/main/', '/main/')
    + 'code/main.' + ext;
}

function fetchMarkdown(rawUrl, cacheKey) {
  console.log('[Lesson] Fetching:', rawUrl);
  var cached = localStorage.getItem(cacheKey);
  if (cached) {
    console.log('[Lesson] Cache hit:', cacheKey);
    return Promise.resolve(cached);
  }
  return fetch(rawUrl, { mode: 'cors', headers: { 'Accept': 'text/markdown, text/plain' } })
    .then(function(r) {
      console.log('[Lesson] Response:', r.status, r.statusText, r.url);
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + r.statusText);
      return r.text();
    }).then(function(text) {
      console.log('[Lesson] Got content, length:', text.length);
      localStorage.setItem(cacheKey, text);
      return text;
    }).catch(function(err) {
      console.error('[Lesson] Fetch error:', err, 'URL:', rawUrl);
      throw err;
    });
}

function setLang(lang) {
  document.documentElement.setAttribute('data-lang', lang);
  document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.toggle('btn-active', b.getAttribute('data-lang') === lang); });
  renderLesson();
  document.querySelectorAll('[data-en][data-ko]').forEach(function(el) {
    if (el.tagName === 'DIV' || el.tagName === 'P' || el.tagName === 'SPAN' || el.tagName === 'A' || el.tagName === 'H2') {
      el.textContent = el.getAttribute('data-' + lang) || el.textContent;
    }
  });
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const isDark = current === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '\u2600' : '\u263D';
}

function renderLesson() {
  const lang = document.documentElement.getAttribute('data-lang') || 'en';
  const data = findLesson();
  const container = document.getElementById('content');
  
  if (!data) {
    container.innerHTML = '<div class="not-found"><h2 data-en="Lesson Not Found" data-ko="\ub808\uc2a8\uc744 \ucc3e\uc744 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4">Lesson Not Found</h2><p data-en="The lesson you are looking for does not exist." data-ko="\ucc3e\uc73c\uc2dc\ub294 \ub808\uc2a8\uc774 \uc874\uc7ac\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4."></p><a class="back-link" href="index.html" style="display:inline-block;margin-top:20px" data-en="\u2190 Back to Curriculum" data-ko="\u2190 \ucee4\ub9ac\ud074\ub7ec\uc73c\ub85c \ub3cc\uc544\uac00\uae30">\u2190 Back to Curriculum</a></div>';
    return;
  }

  var ph = data.phase;
  var le = data.lesson;
  var li = data.lessonIndex;
  var pi = data.phaseIndex;
  var lname = le.name[lang] || le.name.en;
  var pname = ph.name[lang] || ph.name.en;
  var typeClass = 'tag-' + le.type.toLowerCase();
  var hasPrev = li > 0 || pi > 0;
  var hasNext = li < ph.lessons.length - 1 || pi < PHASES.length - 1;
  var prevHref = '#';
  var nextHref = '#';
  if (li > 0) {
    prevHref = 'lesson.html?p=' + pi + '&l=' + (li - 1);
  } else if (pi > 0) {
    var prevPhase = PHASES[pi - 1];
    prevHref = 'lesson.html?p=' + prevPhase.id + '&l=' + (prevPhase.lessons.length - 1);
  }
  if (li < ph.lessons.length - 1) {
    nextHref = 'lesson.html?p=' + pi + '&l=' + (li + 1);
  } else if (pi < PHASES.length - 1) {
    var nextPhase = PHASES[pi + 1];
    nextHref = 'lesson.html?p=' + nextPhase.id + '&l=0';
  }

  var summaryText = le.summary || '';
  var statusText = le.status || 'unknown';
  var langText = le.lang || '\u2014';
  var keywordsHtml = '';
  if (le.keywords) {
    var kwList = le.keywords.split(' \u00b7 ');
    var kwSpans = kwList.map(function(kw) { return '<span class="keyword">' + kw + '</span>'; });
    keywordsHtml = '<div class="keywords"><h3 data-en="Topics" data-ko="\uc8fc\uc81c">Topics</h3><div class="keyword-list">' + kwSpans.join('') + '</div></div>';
  }

  container.innerHTML = 
    '<div class="phase-badge">' + pname + ' / ' + ph.name.ko + ' \u2014 ' + 'P' + String(pi).padStart(2, '0') + '</div>' +
    '<h1>' + lname + '<span class="ko">' + le.name.ko + '</span></h1>' +
    '<div class="meta-grid">' +
      '<div class="meta-item"><div class="meta-label">Type</div><div class="meta-value"><span class="tag ' + typeClass + '">' + le.type + '</span></div></div>' +
      '<div class="meta-item"><div class="meta-label">Language</div><div class="meta-value lang-tag">' + langText + '</div></div>' +
      '<div class="meta-item"><div class="meta-label">Status</div><div class="meta-value"><span class="status-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--complete);margin-right:4px"></span>' + statusText + '</div></div>' +
    '</div>' +
    '<div class="summary">' + summaryText + '</div>' +
    keywordsHtml +
    '<a class="github-link" href="' + le.url + '" target="_blank" data-en="\u2b73 View on GitHub" data-ko="\u2b73 GitHub\uc5d0\uc11c \ubcf4\uae30">\u2b73 View on GitHub</a>' +
    '<div id="lessonBody" class="content-loading">Loading lesson content...</div>' +
    '<div class="related-nav">' +
      (hasPrev ? '<a href="' + prevHref + '" data-en="\u2190 Previous" data-ko="\u2190 \uc774\uc804 \ub808\uc2a8">\u2190 Previous</a>' : '<span class="disabled" data-en="\u2190 Previous" data-ko="\u2190 \uc774\uc804 \ub808\uc2a8">\u2190 Previous</span>') +
      (hasNext ? '<a href="' + nextHref + '" data-en="Next \u2192" data-ko="\ub2e4\uc74c \ub808\uc2a8 \u2192">Next \u2192</a>' : '<span class="disabled" data-en="Next \u2192" data-ko="\ub2e4\uc74c \ub808\uc2a8 \u2192">Next \u2192</span>') +
    '</div>';

  // Fetch and render lesson content from GitHub
  if (le.url) {
    var rawUrl = toRawUrl(le.url);
    var cacheKey = 'lesson_' + pi + '_' + li;
    console.log('[Lesson] Starting fetch for:', cacheKey, 'URL:', rawUrl);
    fetchMarkdown(rawUrl, cacheKey).then(function(md) {
      console.log('[Lesson] Got markdown, length:', md ? md.length : 0);
      console.log('[Lesson] marked available:', typeof marked !== 'undefined');
      console.log('[Lesson] lessonBody element:', document.getElementById('lessonBody'));
      
      if (typeof marked === 'undefined') {
        console.error('[Lesson] marked is undefined!');
        document.getElementById('lessonBody').className = 'content-error';
        document.getElementById('lessonBody').innerHTML = '<p style="color:#cc4444">Markdown library (marked) not loaded. <a href="' + rawUrl + '" target="_blank">View raw content on GitHub</a></p>';
        return;
      }
      
      try {
        var htmlContent = marked.parse(md);
        console.log('[Lesson] Parsed HTML length:', htmlContent.length);
        var bodyEl = document.getElementById('lessonBody');
        if (!bodyEl) {
          console.error('[Lesson] lessonBody element not found!');
          return;
        }
        bodyEl.className = 'lesson-content';
        bodyEl.innerHTML = htmlContent;
        console.log('[Lesson] Content rendered successfully');
        
        // Apply i18n after content loads
        var clang = document.documentElement.getAttribute('data-lang') || 'en';
        document.querySelectorAll('[data-en][data-ko]').forEach(function(el) {
          if (el.tagName === 'DIV' || el.tagName === 'P' || el.tagName === 'SPAN' || el.tagName === 'A' || el.tagName === 'H2') {
            el.textContent = el.getAttribute('data-' + clang) || el.textContent;
          }
        });
      } catch (e) {
        console.error('[Lesson] Parse/render error:', e);
        document.getElementById('lessonBody').className = 'content-error';
        document.getElementById('lessonBody').innerHTML = '<p style="color:#cc4444">Render error: ' + e.message + '. <a href="' + rawUrl + '" target="_blank">View raw content on GitHub</a></p>';
      }
    }).catch(function(err) {
      console.error('[Lesson] Fetch promise rejected:', err);
      document.getElementById('lessonBody').className = 'content-error';
      document.getElementById('lessonBody').innerHTML = '<p style="color:#cc4444">Failed to load: ' + err.message + '. <a href="' + rawUrl + '" target="_blank">View raw content on GitHub</a></p>';
    });
  }
}

// Fix PHASES ordering
PHASES.sort(function(a, b) { return a.id - b.id; });

// Check marked library
if (typeof marked === 'undefined') {
  console.error('[Lesson] marked.js not loaded!');
  document.getElementById('lessonBody').className = 'content-error';
  document.getElementById('lessonBody').innerHTML = '<p data-en="Markdown library failed to load." data-ko="마크다운 라이브러리 로드 실패.">Markdown library failed to load.</p>';
}

// Init
document.getElementById('themeBtn').textContent = '\u2600';
console.log('[Lesson] Initializing...');
renderLesson();

// Disable right-click
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J')) || (e.ctrlKey && e.key === 'U')) {
    e.preventDefault();
  }
});
</script>
