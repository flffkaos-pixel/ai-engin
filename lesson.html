<script>
function getParams() {
  const params = new URLSearchParams(window.location.search);
  return { p: parseInt(params.get('p')), l: parseInt(params.get('l')) };
}

function findLesson() {
  const params = getParams();
  if (isNaN(params.p) || isNaN(params.l)) return null;
  const phase = PHASES.find(function(ph) { return ph.id === params.p; });
  if (!phase) return null;
  return { phase: phase, lesson: phase.lessons[params.l], lessonIndex: params.l, phaseIndex: params.p };
}

function getLocalMdUrl(phaseId, lessonIndex, lang) {
  return 'md_docs/phases/' + getPhaseSlug(phaseId) + '/' + getLessonSlug(phaseId, lessonIndex) + '/docs/' + lang + '.md';
}

function getPhaseSlug(phaseId) {
  const slugs = [
    '00-setup-and-tooling', '01-math-foundations', '02-ml-fundamentals', '03-deep-learning-core',
    '04-computer-vision', '05-nlp-foundations-to-advanced', '06-speech-and-audio', '07-transformers-deep-dive',
    '08-generative-ai', '09-reinforcement-learning', '10-llms-from-scratch', '11-llm-engineering',
    '12-multimodal-ai', '13-tools-and-protocols', '14-agent-engineering', '15-autonomous-systems',
    '16-multi-agent-and-swarms', '17-infrastructure-and-production', '18-ethics-safety-alignment', '19-capstone-projects'
  ];
  return slugs[phaseId] || 'phase-' + phaseId;
}

function getLessonSlug(phaseId, lessonIndex) {
  const data = findLesson();
  if (!data) return 'lesson-' + lessonIndex;
  const phase = data.phase;
  if (lessonIndex >= 0 && lessonIndex < phase.lessons.length) {
    return phase.lessons[lessonIndex].url.split('/').filter(Boolean).pop() || 'lesson-' + lessonIndex;
  }
  return 'lesson-' + lessonIndex;
}

function fetchMarkdown(url, cacheKey) {
  console.log('[Lesson] Fetching:', url);
  var cached = localStorage.getItem(cacheKey);
  if (cached) {
    console.log('[Lesson] Cache hit:', cacheKey);
    return Promise.resolve(cached);
  }
  return fetch(url)
    .then(function(r) {
      console.log('[Lesson] Response:', r.status, r.statusText, r.url);
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + r.statusText);
      return r.text();
    }).then(function(text) {
      console.log('[Lesson] Got content, length:', text.length);
      localStorage.setItem(cacheKey, text);
      return text;
    }).catch(function(err) {
      console.error('[Lesson] Fetch error:', err, 'URL:', url);
      throw err;
    });
}

function setLang(lang) {
  document.documentElement.setAttribute('data-lang', lang);
  document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.toggle('btn-active', b.getAttribute('data-lang') === lang); });
  renderLesson();

    if (el.tagName === 'DIV' || el.tagName === 'P' || el.tagName === 'SPAN' || el.tagName === 'A' || el.tagName === 'H2') {
      el.textContent = el.getAttribute('data-' + lang) || el.textContent;
    }
  });
  localStorage.setItem('aieng_lang', lang);
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const isDark = current === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '\u2600' : '\u263D';
  localStorage.setItem('aieng_theme', isDark ? 'light' : 'dark');
}

function applyStoredSettings() {
  const storedLang = localStorage.getItem('aieng_lang') || 'en';
  const storedTheme = localStorage.getItem('aieng_theme') || 'light';
  document.documentElement.setAttribute('data-lang', storedLang);
  document.documentElement.setAttribute('data-theme', storedTheme);
  document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.toggle('btn-active', b.getAttribute('data-lang') === storedLang); });
  document.getElementById('themeBtn').textContent = storedTheme === 'dark' ? '\u2600' : '\u263D';
}

  const data = findLesson();
  const container = document.getElementById('content');
  
  if (!data) {
    container.innerHTML = '<div class="not-found"><h2 data-en="Lesson Not Found" data-ko="\ub808\uc2a8\uc744 \ucc3e\uc744 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4">Lesson Not Found</h2><p data-en="The lesson you are looking for does not exist." data-ko="\ucc3e\uc73c\uc2dc\ub294 \ub808\uc2a8\uc774 \uc874\uc7ac\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4."></p><a class="back-link" href="index.html" style="display:inline-block;margin-top:20px" data-en="\u2190 Back to Curriculum" data-ko="\u2190 \ucee4\ub9ac\ud074\ub7ec\uc73c\ub85c \ub3cc\uc544\uac00\uae30">\u2190 Back to Curriculum</a></div>';
    return;
  }

  var ph = data.phase;
  var le = data.lesson;
  var li = data.lessonIndex;
  var pi = data.phaseIndex;
  var lname = le.name[lang] || le.name.en;
  var pname = ph.name[lang] || ph.name.en;
  var typeClass = 'tag-' + le.type.toLowerCase();
  var hasPrev = li > 0 || pi > 0;
  var hasNext = li < ph.lessons.length - 1 || pi < PHASES.length - 1;
  var prevHref = '#';
  var nextHref = '#';
  if (li > 0) {
    prevHref = 'lesson.html?p=' + pi + '&l=' + (li - 1);
  } else if (pi > 0) {
    var prevPhase = PHASES[pi - 1];
    prevHref = 'lesson.html?p=' + prevPhase.id + '&l=' + (prevPhase.lessons.length - 1);
  }
  if (li < ph.lessons.length - 1) {
    nextHref = 'lesson.html?p=' + pi + '&l=' + (li + 1);
  } else if (pi < PHASES.length - 1) {
    var nextPhase = PHASES[pi + 1];
    nextHref = 'lesson.html?p=' + nextPhase.id + '&l=0';
  }

  var summaryText = le.summary || '';
  var statusText = le.status || 'unknown';
  var langText = le.lang || '\u2014';
  var keywordsHtml = '';
  if (le.keywords) {
    var kwList = le.keywords.split(' \u00b7 ');
    var kwSpans = kwList.map(function(kw) { return '<span class="keyword">' + kw + '</span>'; });
    keywordsHtml = '<div class="keywords"><h3 data-en="Topics" data-ko="\uc8fc\uc81c">Topics</h3><div class="keyword-list">' + kwSpans.join('') + '</div></div>';
  }

  container.innerHTML = 
    '<div class="phase-badge">' + pname + ' / ' + ph.name.ko + ' \u2014 ' + 'P' + String(pi).padStart(2, '0') + '</div>' +
    '<h1>' + lname + '<span class="ko">' + le.name.ko + '</span></h1>' +
    '<div class="meta-grid">' +
      '<div class="meta-item"><div class="meta-label" data-en="Type" data-ko="유형">Type</div><div class="meta-value"><span class="tag ' + typeClass + '">' + le.type + '</span></div></div>' +
      '<div class="meta-item"><div class="meta-label" data-en="Language" data-ko="언어">Language</div><div class="meta-value lang-tag">' + langText + '</div></div>' +
      '<div class="meta-item"><div class="meta-label" data-en="Status" data-ko="상태">Status</div><div class="meta-value"><span class="status-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--complete);margin-right:4px"></span>' + statusText + '</div></div>' +
    '</div>' +
    '<div class="summary">' + summaryText + '</div>' +
    keywordsHtml +

    '<div id="lessonBody" class="content-loading" data-en="Loading lesson content..." data-ko="레슨 내용을 불러오는 중...">Loading lesson content...</div>' +
    '<div class="related-nav">' +
      (hasPrev ? '<a href="' + prevHref + '" data-en="\u2190 Previous" data-ko="\u2190 \uc774\uc804 \ub808\uc2a8">\u2190 Previous</a>' : '<span class="disabled" data-en="\u2190 Previous" data-ko="\u2190 \uc774\uc804 \ub808\uc2a8">\u2190 Previous</span>') +
      (hasNext ? '<a href="' + nextHref + '" data-en="Next \u2192" data-ko="\ub2e4\uc74c \ub808\uc2a8 \u2192">Next \u2192</a>' : '<span class="disabled" data-en="Next \u2192" data-ko="\ub2e4\uc74c \ub808\uc2a8 \u2192">Next \u2192</span>') +
    '</div>';

  updateSEO(pname, lname, le.type, le.keywords, pi, li);

  // Fetch and render lesson content from local md_docs
  if (le.url) {
    var mdLang = document.documentElement.getAttribute('data-lang') || 'en';
    var mdUrl = getLocalMdUrl(pi, li, mdLang);
    var cacheKey = 'lesson_' + mdLang + '_' + pi + '_' + li;
    console.log('[Lesson] Starting fetch for:', cacheKey, 'URL:', mdUrl);
    
    fetchMarkdown(mdUrl, cacheKey).then(function(md) {
      console.log('[Lesson] Got markdown, length:', md ? md.length : 0);
      console.log('[Lesson] marked available:', typeof marked !== 'undefined');
      console.log('[Lesson] lessonBody element:', document.getElementById('lessonBody'));
      
      if (typeof marked === 'undefined') {
        console.error('[Lesson] marked is undefined!');
        document.getElementById('lessonBody').className = 'content-error';
        document.getElementById('lessonBody').innerHTML = '<p data-en="Markdown library (marked) not loaded. Please refresh the page." data-ko="마크다운 라이브러리 로드에 실패했습니다. 페이지를 새로고침 해주세요.">Markdown library (marked) not loaded. Please refresh the page.</p>';
        return;
      }
      
      if (!md || md.length < 10) {
        console.error('[Lesson] Markdown content is empty or too short');
        document.getElementById('lessonBody').className = 'content-error';
        document.getElementById('lessonBody').innerHTML = '<p data-en="Lesson content is empty." data-ko="레슨 내용이 비어있습니다.">Lesson content is empty.</p>';
        return;
      }
      
      try {
        var htmlContent = marked.parse(md);
        console.log('[Lesson] Parsed HTML length:', htmlContent.length);
        var bodyEl = document.getElementById('lessonBody');
        if (!bodyEl) {
          console.error('[Lesson] lessonBody element not found!');
          return;
        }
        bodyEl.className = 'lesson-content';
        bodyEl.innerHTML = htmlContent;
        console.log('[Lesson] Content rendered successfully from local md_docs (' + mdLang + ')');
        
        if (lang !== mdLang) {
          lang = mdLang;
        }
      } catch (e) {
        console.error('[Lesson] Parse/render error:', e);
        document.getElementById('lessonBody').className = 'content-error';
        document.getElementById('lessonBody').innerHTML = '<p data-en="Render error: ' + e.message + '" data-ko="렌더링 오류: ' + e.message + '">Render error: ' + e.message + '</p>';
      }
    }).catch(function(err) {
      console.error('[Lesson] Fetch promise rejected:', err);
      if (mdLang === 'ko') {
        var enUrl = getLocalMdUrl(pi, li, 'en');
        var enCacheKey = 'lesson_en_' + pi + '_' + li;
        console.log('[Lesson] Trying English fallback:', enUrl);
        fetchMarkdown(enUrl, enCacheKey).then(function(enMd) {
          if (!enMd || enMd.length < 10) {
            document.getElementById('lessonBody').className = 'content-error';
            document.getElementById('lessonBody').innerHTML = '<p data-en="Failed to load lesson content." data-ko="레슨 내용을 불러오지 못했습니다.">Failed to load lesson content.</p>';
            return;
          }
          try {
            var enHtml = marked.parse(enMd);
            document.getElementById('lessonBody').className = 'lesson-content';
            document.getElementById('lessonBody').innerHTML = enHtml;
            console.log('[Lesson] Content rendered from English fallback');
          } catch(e) {
            document.getElementById('lessonBody').className = 'content-error';
            document.getElementById('lessonBody').innerHTML = '<p data-en="Failed to load content." data-ko="내용을 불러오지 못했습니다.">Failed to load content.</p>';
          }
        }).catch(function() {
          document.getElementById('lessonBody').className = 'content-error';
          document.getElementById('lessonBody').innerHTML = '<p data-en="Failed to load lesson content." data-ko="레슨 내용을 불러오지 못했습니다.">Failed to load lesson content.</p>';
        });
      } else {
        document.getElementById('lessonBody').className = 'content-error';
        document.getElementById('lessonBody').innerHTML = '<p data-en="Failed to load lesson content (' + err.message + ')." data-ko="레슨 내용을 불러오지 못했습니다 (' + err.message + ').">Failed to load lesson content (' + err.message + ').</p>';
      }
    });
  }
}

// Fix PHASES ordering
PHASES.sort(function(a, b) { return a.id - b.id; });

// Check marked library
if (typeof marked === 'undefined') {
  console.error('[Lesson] marked.js not loaded!');
  document.getElementById('lessonBody').className = 'content-error';
  document.getElementById('lessonBody').innerHTML = '<p data-en="Markdown library failed to load." data-ko="마크다운 라이브러리 로드 실패.">Markdown library failed to load.</p>';
}

// Init
applyStoredSettings();
console.log('[Lesson] Initializing...');
renderLesson();

// Disable right-click
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J')) || (e.ctrlKey && e.key === 'U')) {
    e.preventDefault();
  }
});
</script>
</body>
</html>
